name: Build Android AAB & APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    - name: Setup Android SDK Path
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        mkdir -p $HOME/.bubblewrap
        echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > $HOME/.bubblewrap/config.json

    - name: Decode Keystore from Secrets
      run: |
        mkdir -p android-app
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android-app/android.keystore

    - name: Generate Android Project
      env:
        BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        cd android-app
        bubblewrap init \
          --manifest=https://amar-hisab.sohag18267.workers.dev/twa-manifest.json \
          --directory=. \
          --skipPwaValidation \
          --jdkPath "$JAVA_HOME"

    - name: Update Signing Config
      env:
        BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        BUBBLEWRAP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        cd android-app
        if [ -f "app/build.gradle" ]; then
          sed -i "s|signingConfigs {|signingConfigs {\n        release {\n            storeFile file(\"../android.keystore\")\n            storePassword System.getenv(\"BUBBLEWRAP_KEYSTORE_PASSWORD\")\n            keyAlias System.getenv(\"BUBBLEWRAP_KEY_ALIAS\")\n            keyPassword System.getenv(\"BUBBLEWRAP_KEY_PASSWORD\")\n        }|" app/build.gradle
        fi

    - name: Build AAB and APK
      env:
        BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        BUBBLEWRAP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        cd android-app
        bubblewrap build --skipPwaValidation

    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-bundle
        path: android-app/app-release-bundle.aab
        if-no-files-found: error

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-signed
        path: android-app/app-release-signed.apk
        if-no-files-found: error
