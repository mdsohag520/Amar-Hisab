name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    - name: Create Bubblewrap Config File
      run: |
        # Use pre-installed Android SDK from GitHub runner
        export ANDROID_HOME=/usr/local/lib/android/sdk
        mkdir -p $HOME/.bubblewrap
        echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > $HOME/.bubblewrap/config.json
        cat $HOME/.bubblewrap/config.json

    - name: Verify Bubblewrap Paths
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        bubblewrap doctor || true

    - name: Create Keystore
      run: |
        mkdir -p android-app
        cd android-app
        keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=Amar Hisab, OU=Dev, O=Amar Hisab, L=Dhaka, ST=Dhaka, C=BD"

    - name: Init Bubblewrap Project
      env:
        BUBBLEWRAP_KEYSTORE_PASSWORD: password123
        BUBBLEWRAP_KEY_PASSWORD: password123
      run: |
        cd android-app
        cat > bubblewrap.config.json <<'CONFIG'
        {
          "packageId": "com.sohag.amarhisab",
          "host": "amar-hisab.sohag18267.workers.dev",
          "name": "আমার হিসাব",
          "launcherName": "আমার হিসাব",
          "display": "standalone",
          "themeColor": "#059669",
          "backgroundColor": "#0f172a",
          "startUrl": "/",
          "iconUrl": "https://amar-hisab.sohag18267.workers.dev/pwa-512x512.png",
          "maskableIconUrl": "https://amar-hisab.sohag18267.workers.dev/pwa-512x512.png",
          "signingKey": {
            "path": "./android.keystore",
            "alias": "android"
          },
          "appVersionName": "1.0.0",
          "appVersionCode": 1,
          "shortcuts": [],
          "generatorApp": "bubblewrap-cli",
          "webManifestUrl": "https://amar-hisab.sohag18267.workers.dev/manifest.webmanifest",
          "fallbackType": "customtabs",
          "features": {},
          "enableNotifications": false,
          "isChromeOSOnly": false,
          "isMetaQuest": false,
          "fullScopeUrl": "https://amar-hisab.sohag18267.workers.dev/",
          "minSdkVersion": 19,
          "orientation": "portrait"
        }
        CONFIG
        bubblewrap init --config=bubblewrap.config.json --directory=. --skipPwaValidation

    - name: Build APK
      env:
        BUBBLEWRAP_KEYSTORE_PASSWORD: password123
        BUBBLEWRAP_KEY_PASSWORD: password123
      run: |
        cd android-app
        bubblewrap build --skipPwaValidation

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-signed
        path: android-app/app-release-signed.apk
        if-no-files-found: error
