name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Build APK using Docker (Bubblewrap)
      run: |
        mkdir -p android-app
        cd android-app
        
        # Init bubblewrap project non-interactively inside Docker
        docker run --rm -v "$PWD":/app -w /app google/bubblewrap:latest \
          bubblewrap init \
          --manifest=https://amar-hisab.sohag18267.workers.dev/manifest.webmanifest \
          --directory=.
          
        # Build the APK inside Docker
        docker run --rm -v "$PWD":/app -w /app google/bubblewrap:latest \
          bubblewrap build --skipPwaValidation

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-signed
        path: android-app/app-release-signed.apk
        if-no-files-found: error
